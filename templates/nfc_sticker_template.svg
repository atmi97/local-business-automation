<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="85.6mm" height="54mm">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Card with 3.18mm rounded corners -->
  <rect x="10" y="10" width="836" height="520" rx="32" ry="32" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="4" filter="url(#cardShadow)"/>

  <!-- Top Google 4-Color Accent Strip -->
  <path d="M 42 10 L 220 10" stroke="#4285F4" stroke-width="8" stroke-linecap="round"/>
  <path d="M 230 10 L 420 10" stroke="#EA4335" stroke-width="8" stroke-linecap="round"/>
  <path d="M 430 10 L 620 10" stroke="#FBBC05" stroke-width="8" stroke-linecap="round"/>
  <path d="M 630 10 L 814 10" stroke="#34A853" stroke-width="8" stroke-linecap="round"/>

  <!-- 5 Gold Stars Rating -->
  <g transform="translate(308, 55)">
    <text font-size="34" fill="#FBBC05" letter-spacing="6">★★★★★</text>
  </g>

  <!-- Main Headline -->
  <text x="428" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#0f172a" text-anchor="middle">
    REVIEW US ON GOOGLE
  </text>
  <text x="428" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#64748b" text-anchor="middle">
    Your feedback helps our local Saskatoon team grow!
  </text>

  <!-- Divider -->
  <line x1="120" y1="205" x2="736" y2="205" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left Side: Contactless NFC Tap Zone -->
  <g transform="translate(60, 235)">
    <!-- Contactless / NFC Target Box -->
    <rect x="0" y="0" width="340" height="230" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    
    <!-- Phone & NFC Wave Icon -->
    <circle cx="170" cy="85" r="45" fill="#3b82f6"/>
    <!-- Wave symbols -->
    <path d="M 160 85 Q 165 75 170 75 Q 175 75 180 85" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 152 93 Q 165 65 178 93" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="170" cy="102" r="4" fill="#ffffff"/>

    <text x="170" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a" text-anchor="middle">
      TAP PHONE HERE
    </text>
    <text x="170" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#3b82f6" text-anchor="middle">
      Instant &amp; Contactless (NFC)
    </text>
  </g>

  <!-- Right Side: QR Code Backup Zone -->
  <g transform="translate(456, 235)">
    <rect x="0" y="0" width="340" height="230" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Mock High-Contrast QR Code Placeholder -->
    <rect x="95" y="25" width="150" height="150" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" rx="8"/>
    <!-- QR Corner Targets -->
    <rect x="110" y="40" width="35" height="35" fill="#0f172a" rx="4"/>
    <rect x="117" y="47" width="21" height="21" fill="#ffffff"/>
    <rect x="123" y="53" width="9" height="9" fill="#0f172a"/>

    <rect x="195" y="40" width="35" height="35" fill="#0f172a" rx="4"/>
    <rect x="202" y="47" width="21" height="21" fill="#ffffff"/>
    <rect x="208" y="53" width="9" height="9" fill="#0f172a"/>

    <rect x="110" y="125" width="35" height="35" fill="#0f172a" rx="4"/>
    <rect x="117" y="132" width="21" height="21" fill="#ffffff"/>
    <rect x="123" y="138" width="9" height="9" fill="#0f172a"/>

    <!-- QR Data Elements -->
    <rect x="160" y="55" width="15" height="15" fill="#0f172a"/>
    <rect x="165" y="85" width="25" height="15" fill="#0f172a"/>
    <rect x="195" y="110" width="20" height="20" fill="#0f172a"/>
    <rect x="155" y="125" width="20" height="15" fill="#0f172a"/>

    <text x="170" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#475569" text-anchor="middle">
      OR SCAN WITH CAMERA
    </text>
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="428" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    POWERED BY YXE LOCAL REVIEWS • FAST CONTACTLESS REPUTATION
  </text>
</svg>
